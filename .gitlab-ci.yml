stages:
  - test

variables:
  GIT_DEPTH: "1"

# On a Dev build tag the PF-CORE tests are started manually (a Dev client build does
# not need to re-run the full suite) and are non-blocking; on every other ref
# (branches, MRs, QA/Release/Hotfix) they keep running automatically.
.rules-test:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^Dev/'
      when: manual
      allow_failure: true
    - when: on_success

security-java-scan:
  stage: test
  extends: .rules-test
  tags:
    - Linux
    - Development
  image: eclipse-temurin:17-jdk
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apt-get update && apt-get install -y ant unzip curl
    - mkdir -p reports
  script:
    - ant -f security-scan.xml dependency-check
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
    when: always

test-Linux:
  stage: test
  extends: .rules-test
  parallel: 2
  cache:
    key: toolchain-jdk-21.0.10_7-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - Linux
  script:
    - ant run-tests -Dshard.total=$CI_NODE_TOTAL -Dshard.index=$((CI_NODE_INDEX-1)) -Dtest.threads=1 -Dtest.fork.heap=1g
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always

test-macOS:
  stage: test
  extends: .rules-test
  resource_group: tests-macOS
  cache:
    key: toolchain-jdk-21.0.10_7-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - macOS
  script:
    - if [ -n "$CI_PROJECT_DIR" ]; then for pid in $(pgrep -f java || true); do case "$(ps -o command= -p $pid 2>/dev/null)" in *"$CI_PROJECT_DIR"*) kill -9 "$pid" || true;; esac; done; fi
    - for pid in $(ps -A -o pid=,etime=,comm= | awk '/java/ && ($2 ~ /-/ || $2 ~ /^[0-9]+:[0-9][0-9]:[0-9][0-9]$/) {print $1}'); do kill -9 "$pid" || true; done
    - mkdir -p test-reports
    # PFC-3573: external thread-dump watchdog. If a test JVM runs longer than ~10 minutes it is considered hung;
    # jstack -F works even when the JVM is frozen (safepoint stall). Dumps land in the test-reports artifact.
    - |
      (
        for i in $(seq 1 20); do
          sleep 300
          for p in $(pgrep -f JUnitTestRunner || true); do
            AGE=$(ps -o etime= -p "$p" | tr -d ' ')
            case "$AGE" in
              *:*:*|[1-9][0-9]:*) jstack -F "$p" > "test-reports/jstack-${i}-${p}.txt" 2>&1 || jstack "$p" > "test-reports/jstack-${i}-${p}.txt" 2>&1 ;;
            esac
          done
        done
      ) &
      WATCHDOG_PID=$!
    - rc=0; ant run-tests -Dtest.threads=2 -Dtest.fork.heap=1g || rc=$?; kill $WATCHDOG_PID 2>/dev/null || true; exit $rc
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always

test-Windows:
  stage: test
  extends: .rules-test
  resource_group: tests-Windows
  cache:
    key: toolchain-jdk-21.0.10_7-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - Windows
  script:
    - powershell -Command "$dir = $env:CI_PROJECT_DIR; if ($dir) { Get-CimInstance Win32_Process -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'java.exe' -and $_.CommandLine -and $_.CommandLine.Contains($dir) } | ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue } }; exit 0"
    - powershell -Command "Get-Process java -ErrorAction SilentlyContinue | Where-Object { $_.StartTime -lt (Get-Date).AddHours(-2) } | Stop-Process -Force; exit 0"
    - call ant run-tests -Dtest.threads=2 -Dtest.fork.heap=1g
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always
