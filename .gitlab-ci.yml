stages:
  - test

variables:
  GIT_DEPTH: "1"

security-java-scan:
  stage: test
  tags:
    - Linux
    - Development
  image: eclipse-temurin:17-jdk
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apt-get update && apt-get install -y ant unzip curl
    - mkdir -p reports
  script:
    - ant -f security-scan.xml dependency-check
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
    when: always

test-Linux:
  stage: test
  resource_group: tests-Linux
  tags:
    - Linux
  script:
    - pkill -f java || true
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*

test-macOS:
  stage: test
  resource_group: tests-macOS
  tags:
    - macOS
  script:
    - pkill -f java || true
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*

test-Windows:
  stage: test
  resource_group: tests-Windows
  tags:
    - Windows
  script:
    - powershell -Command "Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Host 'Old Java processes killed (if any)'"
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
