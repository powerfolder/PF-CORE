stages:
  - test

variables:
  GIT_DEPTH: "1"

# On a Dev build tag the PF-CORE tests are started manually (a Dev client build does
# not need to re-run the full suite) and are non-blocking; on every other ref
# (branches, MRs, QA/Release/Hotfix) they keep running automatically.
.rules-test:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^Dev/'
      when: manual
      allow_failure: true
    - when: on_success

security-java-scan:
  stage: test
  extends: .rules-test
  tags:
    - Linux
    - Development
  image: eclipse-temurin:17-jdk
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apt-get update && apt-get install -y ant unzip curl
    - mkdir -p reports
  script:
    - ant -f security-scan.xml dependency-check
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
    when: always

test-Linux:
  stage: test
  extends: .rules-test
  parallel: 2
  cache:
    key: toolchain-jdk-21.0.10_7-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - Linux
  script:
    - ant run-tests -Dshard.total=$CI_NODE_TOTAL -Dshard.index=$((CI_NODE_INDEX-1)) -Dtest.threads=2
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always

test-macOS:
  stage: test
  extends: .rules-test
  resource_group: tests-macOS
  cache:
    key: toolchain-jdk-21.0.10_7-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - macOS
  script:
    - pkill -f java || true
    - mkdir -p test-reports
    # PFC-3573: external thread-dump watchdog. If a test JVM runs longer than ~10 minutes it is considered hung;
    # jstack -F works even when the JVM is frozen (safepoint stall). Dumps land in the test-reports artifact.
    - |
      (
        for i in $(seq 1 20); do
          sleep 300
          for p in $(pgrep -f JUnitTestRunner || true); do
            AGE=$(ps -o etime= -p "$p" | tr -d ' ')
            case "$AGE" in
              *:*:*|[1-9][0-9]:*) jstack -F "$p" > "test-reports/jstack-${i}-${p}.txt" 2>&1 || jstack "$p" > "test-reports/jstack-${i}-${p}.txt" 2>&1 ;;
            esac
          done
        done
      ) &
      WATCHDOG_PID=$!
    - ant run-tests -Dtest.threads=2
    - kill $WATCHDOG_PID 2>/dev/null || true
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always

test-Windows:
  stage: test
  extends: .rules-test
  resource_group: tests-Windows
  cache:
    key: toolchain-jdk-21.0.10_7-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - Windows
  script:
    - call ant run-tests -Dtest.threads=2
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always
