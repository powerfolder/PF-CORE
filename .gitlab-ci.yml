stages:
  - test

variables:
  GIT_DEPTH: "1"

security-java-scan:
  stage: test
  tags:
    - Linux
    - Development
  image: eclipse-temurin:17-jdk
  variables:
    GIT_STRATEGY: clone
  before_script:
    - apt-get update && apt-get install -y ant unzip curl
    - mkdir -p reports
  script:
    - ant -f security-scan.xml dependency-check
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
    when: always

test-Linux:
  stage: test
  resource_group: tests-Linux
  tags:
    - Linux
  script:
    - pkill -f java || true
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*

test-macOS:
  stage: test
  resource_group: tests-macOS
  tags:
    - macOS
  script:
    - pkill -f java || true
    - mkdir -p test-reports
    # PFC-3573: external thread-dump watchdog. If a test JVM runs longer than ~10 minutes it is considered hung;
    # jstack -F works even when the JVM is frozen (safepoint stall). Dumps land in the test-reports artifact.
    - |
      (
        for i in $(seq 1 20); do
          sleep 300
          for p in $(pgrep -f JUnitTestRunner || true); do
            AGE=$(ps -o etime= -p "$p" | tr -d ' ')
            case "$AGE" in
              *:*:*|[1-9][0-9]:*) jstack -F "$p" > "test-reports/jstack-${i}-${p}.txt" 2>&1 || jstack "$p" > "test-reports/jstack-${i}-${p}.txt" 2>&1 ;;
            esac
          done
        done
      ) &
      WATCHDOG_PID=$!
    - ant run-tests
    - kill $WATCHDOG_PID 2>/dev/null || true
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always

test-Windows:
  stage: test
  resource_group: tests-Windows
  tags:
    - Windows
  script:
    - powershell -Command "Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Host 'Old Java processes killed (if any)'"
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
