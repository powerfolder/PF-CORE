stages:
  - test

variables:
  GIT_DEPTH: "1"

# On a Dev build tag (Dev_<kind>_<name>, as in PF-PRO) the PF-CORE tests are started manually
# (a Dev client build does not need to re-run the full suite). Unlike the PF-PRO builds they are
# non-blocking: nothing waits for them, so an unstarted test must not leave the pipeline blocked.
# Every other branch or tag keeps running them automatically; merge requests get no pipeline of
# their own, as before the rules existed (the branch pipeline covers them).
.rules-test:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - if: '$CI_COMMIT_REF_NAME =~ /^Dev_/'
      when: manual
      allow_failure: true
    - when: on_success

security-java-scan:
  stage: test
  extends: .rules-test
  tags:
    - Linux
    - Development
  image: eclipse-temurin:17-jdk
  variables:
    GIT_STRATEGY: clone
  # The fresh clone wipes tools/, so without a cache every run re-downloads the whole NVD (400k+ records, 40+ min
  # without NVD_API_KEY) and is that long exposed to NVD hiccups and to stray kills on the shared runner.
  # Keyed by the dependency-check version: a new version may change the database schema.
  cache:
    key: dependency-check-12.1.0
    paths:
      - tools/dependency-check/dependency-check/
  retry:
    max: 1
    when:
      - script_failure
      - runner_system_failure
  before_script:
    - apt-get update && apt-get install -y ant unzip curl
    - mkdir -p reports
    - if [ -z "$NVD_API_KEY" ]; then echo "NVD_API_KEY not set - NVD download is heavily rate limited"; fi
  script:
    - ant -f security-scan.xml dependency-check
  artifacts:
    paths:
      - reports/
    expire_in: 30 days
    when: always

test-Linux:
  stage: test
  extends: .rules-test
  resource_group: tests-Linux
  cache:
    key: toolchain-jdk-25.0.4.1_1-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - Linux
  script:
    # Only stale test JVMs: a bare "pkill -f java" also kills any security-java-scan (ant + dependency-check)
    # running on the same shell runner.
    - pkill -f 'launch\.Launcher.* run-tests|StandaloneLauncher|JUnitTestRunner' || true
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always

test-macOS:
  stage: test
  extends: .rules-test
  resource_group: tests-macOS
  cache:
    key: toolchain-jdk-25.0.4.1_1-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - macOS
  script:
    - pkill -f java || true
    - mkdir -p test-reports
    # PFC-3573: external thread-dump watchdog. If a test JVM runs longer than ~10 minutes it is considered hung;
    # jstack -F works even when the JVM is frozen (safepoint stall). Dumps land in the test-reports artifact.
    - |
      (
        for i in $(seq 1 20); do
          sleep 300
          for p in $(pgrep -f JUnitTestRunner || true); do
            AGE=$(ps -o etime= -p "$p" | tr -d ' ')
            case "$AGE" in
              *:*:*|[1-9][0-9]:*) jstack -F "$p" > "test-reports/jstack-${i}-${p}.txt" 2>&1 || jstack "$p" > "test-reports/jstack-${i}-${p}.txt" 2>&1 ;;
            esac
          done
        done
      ) &
      WATCHDOG_PID=$!
    - ant run-tests
    - kill $WATCHDOG_PID 2>/dev/null || true
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always

test-Windows:
  stage: test
  extends: .rules-test
  resource_group: tests-Windows
  cache:
    key: toolchain-jdk-25.0.4.1_1-ant-1.10.17
    paths:
      - .toolchain/dl/
  tags:
    - Windows
  script:
    - powershell -Command "Get-Process java -ErrorAction SilentlyContinue | Stop-Process -Force; Write-Host 'Old Java processes killed (if any)'"
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*
    when: always
