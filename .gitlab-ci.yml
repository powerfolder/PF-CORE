stages:
  - test

test-Linux:
  stage: test
  tags:
    - Linux
    - Tests
  script:
    - pkill -f java || true
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*

test-macOS:
  stage: test
  tags:
    - macOS
    - Tests
  script:
    - pkill -f java || true
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*

test-Windows:
  stage: test
  tags:
    - Windows
    - Tests
  script:
    - echo "Killing old Java processes..."
    - taskkill /F /IM java.exe || echo "No old java processes running"
    - ant run-tests
  artifacts:
    reports:
      junit: test-reports/raw/TEST-*.xml
    paths:
      - test-reports/*