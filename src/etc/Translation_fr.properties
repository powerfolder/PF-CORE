# Fichier de traduction PowerFolder
#
# Guide :
# Les traductions manquantes sont marquées avec ## au début de la ligne.
# Vous devez simplement traduire le texte anglais après le signe "=".
# Ensuite, supprimez les ## au début de la ligne.
#
# Les textes anglais originaux pour les traductions existantes sont
# indiqués avec #orig#. Veuillez vérifier si le sens reste le même.
#
# Pour traduire les textes dans le bon encodage, utilisez
# l'éditeur Properties de l'URL suivante :
# http://propedit.sourceforge.jp/index_en.html
#
# GUIDE : Lancez le programme deux fois, un avec le fichier anglais ouvert
# et l'autre avec le fichier dans votre langue. Activez "afficher le num\u00E9ro de ligne"
# dans le menu Affichage et alignez les 2 programmes côte \u00E0 côte.
# S\u00E9lectionnez UTF-8 comme encodage lors de l'ouverture d'un fichier
# avec l'\u00E9diteur de propri\u00E9t\u00E9s.
#
# Une fois termin\u00E9, veuillez envoyer votre fichier de traduction \u00E0
# development@powerfolder.com
#
# Merci,
# L'\u00E9quipe PowerFolder
# http://www.powerfolder.com
#

