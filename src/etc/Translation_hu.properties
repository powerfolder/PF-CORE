login.saml.browser_failed = Nem siker\u00fclt bejelentkezni a(z) {APPNAME} kliensbe. K\u00e9rj\u00fck, z\u00e1rja be ezt a b\u00f6ng\u00e9sz\u0151f\u00fclet, ind\u00edtsa \u00fajra a klienst \u00e9s pr\u00f3b\u00e1ljon \u00fajra bejelentkezni.
login.saml.browser_init_problem.message = A b\u00f6ng\u00e9sz\u0151t nem siker\u00fclt elind\u00edtani a bejelentkez\u00e9shez (SAML).\nK\u00e9rj\u00fck, ellen\u0151rizze, hogy az alkalmaz\u00e1s csak egyszer fut, \u00e9s rendelkezik a sz\u00fcks\u00e9ges h\u00e1l\u00f3zati jogosults\u00e1gokkal.\nAz alkalmaz\u00e1s \u00fajraind\u00edt\u00e1sa seg\u00edthet. Ha a probl\u00e9ma tov\u00e1bbra is fenn\u00e1ll, a sz\u00e1m\u00edt\u00f3g\u00e9p \u00fajraind\u00edt\u00e1sa is megoldhatja.
login.saml.browser_init_problem.title = Probl\u00e9ma a b\u00f6ng\u00e9sz\u0151alap\u00fa bejelentkez\u00e9ssel
login.saml.browser_login_ongoing.message = Egy b\u00f6ng\u00e9sz\u0151ablak megnyitva a bejelentkez\u00e9shez.\nK\u00e9rj\u00fck, fejezze be a bejelentkez\u00e9si folyamatot a b\u00f6ng\u00e9sz\u0151ben a kliens tov\u00e1bbi haszn\u00e1lat\u00e1hoz.\nEz az ablak automatikusan bez\u00e1r\u00f3dik a sikeres bejelentkez\u00e9s ut\u00e1n.
