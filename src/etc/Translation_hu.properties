login.saml.browser_success = A(z) {APPNAME} kliens sikeresen bejelentkezett. Bez\u00e1rhatja ezt a b\u00f6ng\u00e9sz\u0151f\u00fclet \u00e9s folytathatja a kliens haszn\u00e1lat\u00e1t.
low_memory.already_max = Az alkalmaz\u00e1s m\u00e1r a maxim\u00e1lis munkamem\u00f3ria-korl\u00e1tot haszn\u00e1lja. K\u00e9rj\u00fck, tekintse meg a dokument\u00e1ci\u00f3nkat a tov\u00e1bbi lehet\u0151s\u00e9gek\u00e9rt.
low_memory.configure_failure = Az alkalmaz\u00e1s nem tudta n\u00f6velni a munkamem\u00f3ria-korl\u00e1tot. Windows rendszeren k\u00e9rj\u00fck, futtassa az alkalmaz\u00e1st rendszergazdak\u00e9nt, \u00e9s pr\u00f3b\u00e1lja \u00fajra.
