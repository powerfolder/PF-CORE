login.saml.browser_login_ongoing.message = Oscla\u00edodh fuinneog brabhs\u00e1la\u00ed le haghaidh log\u00e1il isteach.\nCr\u00edochnaigh an pr\u00f3iseas log\u00e1il isteach sa bhrabhs\u00e1la\u00ed chun lean\u00faint ar aghaidh ag \u00fas\u00e1id an chliaint.\nD\u00fanfar an fhuinneog seo go huathoibr\u00edoch nuair a \u00e9ir\u00edonn leis an log\u00e1il isteach.
