login.saml.browser_failed = N\u00ed raibh muid in ann log\u00e1il isteach i do chliant {APPNAME}. D\u00fan an cluais\u00edn brabhs\u00e1la\u00ed seo le do thoil, atosaigh do chliant agus bain triail as log\u00e1il isteach ar\u00eds.
login.saml.browser_init_problem.message = N\u00edorbh fh\u00e9idir an brabhs\u00e1la\u00ed a thos\u00fa le haghaidh log\u00e1il isteach (SAML).\nSeice\u00e1il le do thoil nach bhfuil an feidhmchl\u00e1r ag rith ach uair amh\u00e1in agus go bhfuil na ceadanna l\u00edonra riachtanacha aige.\nD'fh\u00e9adfadh atos\u00fa an fheidhmchl\u00e1ir cabhr\u00fa. M\u00e1 leanann an fhadhb, d'fh\u00e9adfadh atos\u00fa do r\u00edomhaire an cheist a r\u00e9iteach freisin.
