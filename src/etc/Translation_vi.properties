login.saml.browser_init_problem.message = Kh\u00f4ng th\u1ec3 kh\u1edfi \u0111\u1ed9ng tr\u00ecnh duy\u1ec7t \u0111\u1ec3 \u0111\u0103ng nh\u1eadp (SAML).\nVui l\u00f2ng ki\u1ec3m tra r\u1eb1ng \u1ee9ng d\u1ee5ng ch\u1ec9 \u0111ang ch\u1ea1y m\u1ed9t l\u1ea7n v\u00e0 c\u00f3 quy\u1ec1n truy c\u1eadp m\u1ea1ng c\u1ea7n thi\u1ebft.\nKh\u1edfi \u0111\u1ed9ng l\u1ea1i \u1ee9ng d\u1ee5ng c\u00f3 th\u1ec3 gi\u00fap \u00edch. N\u1ebfu s\u1ef1 c\u1ed1 v\u1eabn ti\u1ebfp t\u1ee5c, kh\u1edfi \u0111\u1ed9ng l\u1ea1i m\u00e1y t\u00ednh c\u0169ng c\u00f3 th\u1ec3 gi\u1ea3i quy\u1ebft v\u1ea5n \u0111\u1ec1.
